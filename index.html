<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miguel Lisboa</title>
<meta name="description" content="Miguel Lisboa.">
<meta name="theme-color" content="#121212">
<meta property="og:title" content="Miguel Lisboa">
<meta property="og:type" content="website">
<meta property="og:url" content="https://miguellisboa.com.br">
<meta property="og:image" content="https://miguellisboa.com.br/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://miguellisboa.com.br/og-image.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
  FOTOS: a foto de perfil é o arquivo foto3_final.jpg (topo e fundo desfocado do computador).
  Para as demais, troque cada <div class="ph ..."> por <img class="..." src="..." alt="...">
  mantendo a classe extra.
*/
:root{
  --hero: url("foto3_final.jpg");
  --bg:#121212;
  --surface:rgba(255,255,255,.1);
  --thumb:#3a3a3a;
  --ph:#000;
  --line:rgba(255,255,255,.2);
  --pill:rgba(255,255,255,.2);
  --muted:rgba(255,255,255,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html{background:#0e0e0e}
body{background:#0e0e0e;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,.ph{display:block}
.ph{background:var(--thumb)}
img{object-fit:cover}

/* Fundo desfocado (só no computador): a borda escurece sozinha pelo desfoque sobre o fundo #0e0e0e */
.backdrop{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(128px);z-index:0;pointer-events:none;user-select:none}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:none}

/* Cartão central */
.container{position:relative;z-index:1;max-width:736px;margin:80px auto 80px;background:var(--bg);border-radius:12px;padding:32px 48px 32px}

/* Cabeçalho */
.header{display:flex;flex-direction:column;align-items:center;padding-top:64px}
.portrait{width:390px;max-width:100%;height:auto;aspect-ratio:4/5;border-radius:16px;object-fit:cover;background:var(--thumb)}
.name-wrap{margin-top:24px;text-align:center}
h1{font-size:48px;line-height:60px;font-weight:600;letter-spacing:-.25px}
.socials{display:flex;gap:8px;justify-content:center;margin-top:24px}
.socials a{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;transition:background .15s}
.socials a:hover,.socials a:focus-visible{background:var(--pill)}
.socials svg{width:24px;height:24px}

/* Abas */
.tabs{display:flex;gap:8px;margin:24px 8px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-size:16px;font-weight:500;line-height:24px;padding:2px 8px;border-radius:8px;white-space:nowrap;transition:background .15s}
.tabs a.active,.tabs a:hover{background:var(--pill)}

/* Seções */
section{margin-top:24px;padding:0 0 16px;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;min-height:32px;margin-bottom:31px}
h2{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.25px}
.arrows{display:flex}
.arrows button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.arrows button:disabled{opacity:.35;cursor:default}
.arrows svg{width:20px;height:20px}

/* Carrossel */
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.track::-webkit-scrollbar{display:none}
.track.end{-webkit-mask-image:none;mask-image:none}
.track>*{flex:none;scroll-snap-align:start}

/* Cartão 16:9 com título por cima */
.media{position:relative;width:416px;aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.media .ph,.media img{position:absolute;inset:0;width:100%;height:100%}
.media::after{content:"";position:absolute;inset:0 0 auto 0;height:56px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.media h3{position:absolute;z-index:1;top:10px;left:10px;right:10px;font-size:14px;line-height:18px;font-weight:600;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media .tag{position:absolute;z-index:1;left:10px;bottom:10px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:8px;background:var(--pill)}

/* Galeria */
.tile{width:183px;aspect-ratio:1;border-radius:8px;overflow:hidden}

/* Cartões em grade de 2 linhas (quadrado + nome) */
.track.rows{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:416px;row-gap:16px}
.item{display:flex;align-items:center;height:148px;background:var(--surface);border-radius:8px;overflow:hidden}
.item .ph,.item img{width:144px;height:100%;flex:none}
.item h3{padding:0 16px;font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.25px}
.item .mono{display:grid;place-items:center;font-size:20px;font-weight:600;letter-spacing:-.25px;color:rgba(255,255,255,.75)}
.item small{display:block;margin-top:4px;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}

/* Cartão único com quadrado sobreposto */
.feature{position:relative;display:flex;align-items:center;min-height:168px;padding-left:144px}
.feature .ph,.feature img{position:absolute;left:0;top:50%;transform:translateY(-50%);width:144px;height:144px;border-radius:8px;z-index:1}
.feature .box{position:absolute;inset:0 0 0 96px;background:var(--surface);border-radius:8px;transition:background .15s}
.feature .brand{display:grid;place-items:center;background:#1c1c1c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.feature .brand svg{width:64%;height:auto}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);background:#fff;color:#121212;font-size:14px;font-weight:600;line-height:20px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
.feature:hover .box,.feature:focus-visible .box{background:rgba(255,255,255,.15)}
.feature h3{position:relative;z-index:1;padding:0 16px;font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.25px;word-break:break-word}

footer{margin-top:24px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* Celular */
@media (max-width:767px){
  .backdrop,.vignette{display:none}
  body{background:var(--bg)}
  .container{margin:0;max-width:none;border-radius:0;padding:0 16px 16px}
  .header{position:relative;margin:0 -16px;padding-top:0}
  .portrait{width:100%;max-width:none;border-radius:0}
  .header::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(100vw * 1.25);background:linear-gradient(transparent 75%,var(--bg) 100%);pointer-events:none}
  .name-wrap{position:relative;margin:-50px 0 0;z-index:1}
  h1{font-size:32px;line-height:40px}
  .socials{margin-top:16px}
  .socials a{width:24px;height:24px}
  .tabs{margin:16px -8px 0;padding:0}
  section{margin-top:24px}
  h2{font-size:20px;line-height:25px}
  .media{width:300px}
  .tile{width:152px}
  .track{margin-right:-16px}
  .track.rows{grid-auto-columns:300px}
  .item{height:116px}
  .item .ph,.item img{width:116px}
  .item h3{font-size:14px;line-height:18px}
  .item small{font-size:12px}
  .feature{min-height:136px;padding-left:112px}
  .feature .ph,.feature img{width:112px;height:112px}
  .feature .box{left:64px}
  .feature h3{padding:0 12px;font-size:14px;line-height:18px}
  .sec-head{align-items:flex-start;margin-bottom:25px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<img class="backdrop" src="foto3_final.jpg" alt="" aria-hidden="true" draggable="false">
<div class="vignette" aria-hidden="true"></div>

<main class="container">
  <header class="header">
    <img class="portrait" src="foto3_final.jpg" alt="Miguel Lisboa" width="1080" height="1350" draggable="false">
    <div class="name-wrap"><h1>Miguel Lisboa</h1></div>
    <nav class="socials" aria-label="Redes">
      <a href="https://www.instagram.com/miguelclisboa" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
    </nav>
  </header>

  <nav class="tabs" aria-label="Seções">
    <a href="#trajetoria" class="active">Trajetória</a>
    <a href="#contato">Contato</a>
  </nav>

  <section id="trajetoria">
    <div class="sec-head"><h2>Trajetória</h2><div class="arrows"></div></div>
    <div class="track rows">
      <div class="item"><div class="ph mono" aria-hidden="true">IF</div><h3>Instituto Federal de Alagoas<small>Técnico em Agropecuária · 2026</small></h3></div>
      <div class="item"><div class="ph mono" aria-hidden="true">EX</div><h3>Do Lixo ao Tesouro<small>Projeto de extensão · bolsista</small></h3></div>
      <div class="item"><div class="ph mono" aria-hidden="true">EX</div><h3>Hidroponia na Roça<small>Projeto de extensão · bolsista · 2025</small></h3></div>
    </div>
  </section>

  <section id="contato">
    <div class="sec-head"><h2>Contato</h2></div>
    <a class="feature" href="mailto:contato@miguellisboa.com.br">
      <div class="ph brand" aria-hidden="true"><svg viewBox="0 0 197.73 100"><path fill="#fff" d="M0.00 100.00 L20.81 100.00 L38.42 38.56 L53.64 100.00 L77.39 100.00 L140.81 38.56 L123.19 100.00 L192.00 100.00 L197.73 80.00 L164.33 80.00 A11.00 11.00 0 0 1 153.76 65.97 L172.67 0.00 L151.87 0.00 L69.29 80.00 L49.48 0.00 L28.67 0.00Z"/></svg></div>
      <span class="box"></span>
      <h3>contato@miguellisboa.com.br</h3>
    </a>
  </section>

  <footer>miguellisboa.com.br</footer>
</main>

<div class="toast" role="status" aria-live="polite"></div>
<script>
/* Contato: no computador, copia o e-mail (o mailto: só abre se houver um app de e-mail padrão) */
(function(){
  var t=document.querySelector('.toast'),tm;
  document.querySelectorAll('a[href^="mailto:"]').forEach(function(a){
    a.addEventListener('click',function(){
      if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches||!navigator.clipboard) return;
      var mail=a.getAttribute('href').slice(7);
      navigator.clipboard.writeText(mail).then(function(){
        t.textContent='E-mail copiado: '+mail; t.classList.add('show');
        clearTimeout(tm); tm=setTimeout(function(){t.classList.remove('show')},2600);
      });
    });
  });
})();
(function(){
  var chev=function(d){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="'+(d<0?'m15 6-6 6 6 6':'m9 6 6 6-6 6')+'"/></svg>'};
  document.querySelectorAll('section').forEach(function(sec){
    var track=sec.querySelector('.track'), box=sec.querySelector('.arrows');
    if(!track||!box) return;
    var prev=document.createElement('button'), next=document.createElement('button');
    prev.setAttribute('aria-label','Anterior'); next.setAttribute('aria-label','Próximo');
    prev.innerHTML=chev(-1); next.innerHTML=chev(1);
    box.append(prev,next);
    var step=function(){var c=track.firstElementChild;return c?c.getBoundingClientRect().width+16:track.clientWidth};
    prev.onclick=function(){track.scrollBy({left:-step(),behavior:'smooth'})};
    next.onclick=function(){track.scrollBy({left:step(),behavior:'smooth'})};
    var update=function(){
      var max=track.scrollWidth-track.clientWidth;
      prev.disabled=track.scrollLeft<=2; next.disabled=track.scrollLeft>=max-2;
      track.classList.toggle('end',track.scrollLeft>=max-2);
      box.style.visibility=max>2?'visible':'hidden';
    };
    track.addEventListener('scroll',update,{passive:true});
    window.addEventListener('resize',update); update();
  });

  var links=[].slice.call(document.querySelectorAll('.tabs a'));
  var setActive=function(id){links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+id)})};
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setActive(e.target.id)})},{rootMargin:'-30% 0px -60% 0px'});
    document.querySelectorAll('section').forEach(function(s){io.observe(s)});
  }
  links.forEach(function(a){a.addEventListener('click',function(){setActive(a.getAttribute('href').slice(1))})});
})();
</script>
</body>
</html>
